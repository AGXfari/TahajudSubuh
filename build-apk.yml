# Membangun APK di server GitHub, tanpa perlu memasang Flutter/Android SDK.
#
# Dua cara memakai:
#  A) Seluruh isi proyek di-push ke repo ini, atau
#  B) Cukup unggah tahajud_subuh_companion.zip ke akar repo (praktis dari HP).
# Setelah selesai: tab Actions → jalankan terbaru → Artifacts → tahajud-subuh-apk.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan sumber (zip atau repo langsung)
        run: |
          if [ -f tahajud_subuh_companion.zip ]; then
            unzip -q tahajud_subuh_companion.zip -d src
            echo "APP_DIR=src/tahajud_subuh_companion" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lengkapi kerangka Android
        working-directory: ${{ env.APP_DIR }}
        run: bash tool/prepare_android.sh

      - name: Ambil dependensi
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analisis statis (informasi saja)
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit test
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tahajud-subuh-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
